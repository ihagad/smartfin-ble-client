# GPS+IMU offline pipeline in Docker.
#
#   docker compose build
#   docker compose run --rm pipeline
#
# Outputs appear in ./docker-out/ on the host.

services:
  pipeline:
    build: .
    image: smartfin-ble-client:latest
    volumes:
      - ./docker-out:/workspace/docker-out
    environment:
      SMARTFIN_OUT_DIR: /workspace/docker-out
      # Synthetic path shape (GPS + IMU). Set REGENERATE_FIXTURES=1 to apply.
      # SMARTFIN_TRAJECTORY: straight_line | circle | paddle_pause | stationary
      # SMARTFIN_FIXTURE_DURATION: "180"
      # SMARTFIN_FIXTURE_SPEED: "1.5"
      # SMARTFIN_CIRCLE_RADIUS: "40"
      # SMARTFIN_CIRCLE_SPEED: "1.2"
      # SMARTFIN_PADDLE_S: "30"
      # SMARTFIN_PAUSE_S: "15"
      # SMARTFIN_REGENERATE_FIXTURES: "0"
      # SMARTFIN_IMU_ERROR_DEMO: "1"   # yaw drift + accel bias for fusion demos
      # SMARTFIN_IMU_YAW_DRIFT_DPS: "1.0"
      # SMARTFIN_IMU_ACCEL_BIAS_X: "0.015"

  # Optional: run C++ GPS tests only
  test-gps:
    build: .
    image: smartfin-ble-client:latest
    command:
      - bash
      - -lc
      - |
        cd /workspace/build && ctest -R 'gps_' --output-on-failure
        cd /workspace/tests/gps && python3 -m unittest discover -v

  shell:
    build: .
    image: smartfin-ble-client:latest
    stdin_open: true
    tty: true
    entrypoint: ["/bin/bash"]
    volumes:
      - .:/workspace
